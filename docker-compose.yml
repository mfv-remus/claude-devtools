services:
  claude-devtools:
    build: .
    volumes:
      - ${CLAUDE_DIR:-~/.claude}:/data/.claude:ro
    environment:
      - NODE_ENV=production
      - CLAUDE_ROOT=/data/.claude
      - HOST=0.0.0.0
      - PORT=3456
    restart: unless-stopped
    networks:
      - secure_net

  # Container làm nhiệm vụ "mở cổng" và chuyển tiếp traffic vào mạng cô lập
  proxy:
    image: alpine/socat
    command: tcp-listen:3456,fork,reuseaddr tcp-connect:claude-devtools:3456
    ports:
      - "3456:3456"
    networks:
      - external_net
      - secure_net
    restart: unless-stopped

networks:
  external_net:
    driver: bridge
  secure_net:
    driver: bridge
    internal: true
