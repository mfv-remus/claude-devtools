services:
  claude-devtools:
    build: .
    volumes:
      - ${CLAUDE_DIR:-~/.claude}:/data/.claude:ro
      # Mirror the same host path unmapped so absolute symlinks that Claude Code
      # writes inside ~/.claude (e.g. across continued/split sessions) still resolve.
      # (Compose only tilde-expands the source side of a bind mount, so the target
      # side here uses $HOME instead of ~.)
      - ${CLAUDE_DIR:-~/.claude}:${CLAUDE_DIR:-$HOME/.claude}:ro
    environment:
      - NODE_ENV=production
      - CLAUDE_ROOT=/data/.claude
      - HOST=0.0.0.0
      - PORT=3456
    restart: unless-stopped
    networks:
      - secure_net

  # Container làm nhiệm vụ "mở cổng" và chuyển tiếp traffic vào mạng cô lập
  proxy:
    image: alpine/socat
    command: tcp-listen:3456,fork,reuseaddr tcp-connect:claude-devtools:3456
    ports:
      - "127.0.0.1:3456:3456"
    networks:
      - external_net
      - secure_net
    restart: unless-stopped

networks:
  external_net:
    driver: bridge
  secure_net:
    driver: bridge
    internal: true
